name: Daily meta snapshot

on:
  schedule:
    - cron: "17 12 * * *"   # every day at 12:17 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["tracker.py"]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take snapshot and rebuild dashboard
        run: python tracker.py
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meta.db docs/index.html
          git diff --cached --quiet || git commit -m "Meta snapshot $(date -u +%F)"
          git push
